[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vustbench-core"
version = "0.1.0"
description = "Independent city service provision calculations for the VUST benchmark MVP"
requires-python = ">=3.11,<3.15"
dependencies = [
    "geopandas>=1.1,<2",
    "iduedu[io]==3.4.0",
    "objectnat==3.1.0",
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    "pyarrow>=19,<26",
    "scipy>=1.15,<2",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/vustbench_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
