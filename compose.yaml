services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      VUSTBENCH_DATA_DIR: /app/data
      VUSTBENCH_ARTIFACTS_DIR: /app/artifacts
      VUSTBENCH_GRAPH_PATH: ${VUSTBENCH_GRAPH_PATH:-}
      VUSTBENCH_OSM_ID: ${VUSTBENCH_OSM_ID:-}
      VUSTBENCH_GRAPH_TIMEOUT_SECONDS: ${VUSTBENCH_GRAPH_TIMEOUT_SECONDS:-600}
      VUSTBENCH_RUN_TIMEOUT_SECONDS: ${VUSTBENCH_RUN_TIMEOUT_SECONDS:-1800}
      OVERPASS_CACHE_DIR: /app/artifacts/cache/iduedu
      OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      OVERPASS_TIMEOUT: ${OVERPASS_TIMEOUT:-120}
      OVERPASS_MAX_RETRIES: ${OVERPASS_MAX_RETRIES:-1}
      IDUEDU_OSM_SOURCE: ${IDUEDU_OSM_SOURCE:-overpass}
      IDUEDU_PBF_PATH: ${IDUEDU_PBF_PATH:-}
    volumes:
      - ./data:/app/data:ro
      - artifacts:/app/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    stop_grace_period: 15s
  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  artifacts:
